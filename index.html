<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi IA - Asistente Virtual</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <!-- Logotipo estilo IA -->
    <div class="logo-container">
      <svg class="ai-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" stroke="url(#violet-grad)" stroke-width="3" />
        <circle cx="50" cy="25" r="7" fill="#c084fc" />
        <circle cx="28" cy="60" r="7" fill="#a855f7" />
        <circle cx="72" cy="60" r="7" fill="#8b5cf6" />
        <line x1="50" y1="25" x2="28" y2="60" stroke="#a855f7" stroke-width="2" />
        <line x1="50" y1="25" x2="72" y2="60" stroke="#a855f7" stroke-width="2" />
        <line x1="28" y1="60" x2="72" y2="60" stroke="#a855f7" stroke-width="2" />
        <circle cx="50" cy="48" r="10" fill="#e879f9" class="core-node" />
        <defs>
          <linearGradient id="violet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e879f9" />
            <stop offset="100%" stop-color="#6b21a8" />
          </linearGradient>
        </defs>
      </svg>
    </div>

    <h1>Asistente IA</h1>
    <p id="desc">Hola, soy tu asistente virtual inteligente. ¿En qué puedo ayudarte hoy?</p>
    
    <!-- Botón inicial -->
    <div id="main-actions" class="links">
      <button onclick="mostrarChat()" class="btn btn-primary">Iniciar Chat</button>
    </div>

    <!-- Caja de Chat (Oculta al inicio) -->
    <div id="chat-box" class="chat-container" style="display: none;">
      <div id="chat-messages" class="chat-messages">
        <div class="message bot">¡Hola! Soy tu IA. ¿Qué quieres preguntarme?</div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="Escribe un mensaje..." onkeypress="evaluarEnter(event)">
        <button onclick="enviarMensaje()" class="btn-send">➔</button>
      </div>
    </div>
  </div>

  <script>
    function mostrarChat() {
      document.getElementById("main-actions").style.display = "none";
      document.getElementById("desc").style.display = "none";
      document.getElementById("chat-box").style.display = "flex";
    }

    function enviarMensaje() {
      const input = document.getElementById("user-input");
      const texto = input.value.trim();
      if (!texto) return;

      const chatMessages = document.getElementById("chat-messages");

      // Mostrar mensaje del usuario
      const userMsg = document.createElement("div");
      userMsg.className = "message user";
      userMsg.innerText = texto;
      chatMessages.appendChild(userMsg);

      input.value = "";
      chatMessages.scrollTop = chatMessages.scrollHeight;

      // Respuesta automática de la IA
      setTimeout(() => {
        const botMsg = document.createElement("div");
        botMsg.className = "message bot";
        
        // Respuestas predeterminadas
        const txt = texto.toLowerCase();
        if (txt.includes("hola")) {
          botMsg.innerText = "¡Hola! ¿Cómo estás? ¿En qué te puedo ayudar?";
        } else if (txt.includes("quien sos") || txt.includes("quién eres")) {
          botMsg.innerText = "Soy una IA asistente personalizada y creada en GitHub Pages.";
        } else {
          botMsg.innerText = "Entendido. Estoy procesando tu consulta...";
        }

        chatMessages.appendChild(botMsg);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 800);
    }

    function evaluarEnter(e) {
      if (e.key === 'Enter') enviarMensaje();
    }
  </script>

</body>
</html>
