<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente IA - WhatsApp Violeta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-card">
    <!-- Cabecera estilo WhatsApp -->
    <div class="chat-header">
      <div class="avatar-container">
        <svg class="ai-avatar" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" stroke="#c084fc" stroke-width="4" />
          <circle cx="50" cy="25" r="7" fill="#e879f9" />
          <circle cx="28" cy="60" r="7" fill="#a855f7" />
          <circle cx="72" cy="60" r="7" fill="#8b5cf6" />
          <line x1="50" y1="25" x2="28" y2="60" stroke="#a855f7" stroke-width="2" />
          <line x1="50" y1="25" x2="72" y2="60" stroke="#a855f7" stroke-width="2" />
          <line x1="28" y1="60" x2="72" y2="60" stroke="#a855f7" stroke-width="2" />
          <circle cx="50" cy="48" r="10" fill="#e879f9" />
        </svg>
      </div>
      <div class="header-info">
        <h2>Asistente IA</h2>
        <span class="status">en línea</span>
      </div>
    </div>

    <!-- Área de Conversación -->
    <div class="chat-body" id="chat-body">
      <!-- Mensaje de la IA (Izquierda) -->
      <div class="message-wrapper bot">
        <div class="bubble">
          Hola, soy tu asistente virtual inteligente. ¿En qué puedo ayudarte hoy?
          <span class="time">18:36</span>
        </div>
      </div>

      <!-- Mensajes del Usuario (Derecha) -->
      <div class="message-wrapper user">
        <div class="bubble">
          ¡Claro! He actualizado el diseño para que tenga este estilo de chat.
          <span class="time">18:55 <span class="check">✓✓</span></span>
        </div>
      </div>

      <div class="message-wrapper user">
        <div class="bubble">
          Todas las descripciones y funcionalidades anteriores se mantienen. ¿Por dónde empezamos?
          <span class="time">18:50 <span class="check">✓✓</span></span>
        </div>
      </div>

      <!-- Botones de Acción dentro del Chat -->
      <div class="action-buttons">
        <button class="chat-btn btn-filled" onclick="enviarOpcion('Iniciar Chat')">Iniciar Chat</button>
        <button class="chat-btn btn-outline" onclick="enviarOpcion('Probar Funciones')">Probar Funciones</button>
        <button class="chat-btn btn-outline" onclick="enviarOpcion('Documentación')">Documentación</button>
      </div>
    </div>

    <!-- Barra de Entrada Inferior estilo WhatsApp -->
    <div class="chat-footer">
      <div class="input-container">
        <input type="text" id="chat-input" placeholder="Escribe un mensaje..." onkeypress="evaluarEnter(event)">
        <button class="icon-btn">📎</button>
        <button class="icon-btn">🎙️</button>
      </div>
      <button class="send-btn" onclick="enviarMensaje()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="white">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    function obtenerHoraActual() {
      const ahora = new Date();
      const horas = ahora.getHours().toString().padStart(2, '0');
      const minutos = ahora.getMinutes().toString().padStart(2, '0');
      return `${horas}:${minutos}`;
    }

    function enviarMensaje() {
      const input = document.getElementById("chat-input");
      const texto = input.value.trim();
      if (!texto) return;

      agregarMensajeUsuario(texto);
      input.value = "";
      
      // Respuesta automática de la IA
      setTimeout(() => {
        responderIA(texto);
      }, 1000);
    }

    function enviarOpcion(texto) {
      agregarMensajeUsuario(texto);
      setTimeout(() => {
        responderIA(texto);
      }, 1000);
    }

    function agregarMensajeUsuario(texto) {
      const chatBody = document.getElementById("chat-body");
      const wrapper = document.createElement("div");
      wrapper.className = "message-wrapper user";
      wrapper.innerHTML = `
        <div class="bubble">
          ${texto}
          <span class="time">${obtenerHoraActual()} <span class="check">✓✓</span></span>
        </div>
      `;
      chatBody.appendChild(wrapper);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function responderIA(consulta) {
      const chatBody = document.getElementById("chat-body");
      const wrapper = document.createElement("div");
      wrapper.className = "message-wrapper bot";

      let respuesta = "Entendido. Estoy procesando tu consulta...";
      const txt = consulta.toLowerCase();

      if (txt.includes("iniciar chat")) {
        respuesta = "¡Chat iniciado! Puedes escribirme lo que quieras.";
      } else if (txt.includes("probar funciones")) {
        respuesta = "Puedo responder preguntas, darte información sobre código o guiarte en tus proyectos.";
      } else if (txt.includes("documentación")) {
        respuesta = "Toda la documentación está desplegada correctamente en GitHub Pages.";
      } else if (txt.includes("hola")) {
        respuesta = "¡Hola! ¿Cómo estás? ¿En qué te puedo ayudar hoy?";
      }

      wrapper.innerHTML = `
        <div class="bubble">
          ${respuesta}
          <span class="time">${obtenerHoraActual()}</span>
        </div>
      `;
      chatBody.appendChild(wrapper);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function evaluarEnter(e) {
      if (e.key === 'Enter') enviarMensaje();
    }
  </script>

</body>
</html>
